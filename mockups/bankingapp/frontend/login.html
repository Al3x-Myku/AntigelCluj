<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurBank — Online Banking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0a0e1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card {
            background: rgba(20,30,50,0.7); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 24px;
            padding: 3rem; max-width: 420px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-card h1 { font-weight: 800; font-size: 1.8rem; }
        .login-card .subtitle { color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        .form-control { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0.8rem 1rem; color: #fff; }
        .form-control:focus { background: rgba(255,255,255,0.08); border-color: #3b82f6; box-shadow: 0 0 20px rgba(59,130,246,0.15); color: #fff; }
        .btn-login { background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; font-weight: 700; padding: 0.8rem; width: 100%; font-size: 1rem; transition: all 0.3s; }
        .btn-login:hover { box-shadow: 0 0 30px rgba(59,130,246,0.4); transform: translateY(-1px); }
        .alert-lockdown { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; color: #fca5a5; }
        .bank-logo { font-size: 2.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bank-logo">🏦</div>
            <h1>SecurBank</h1>
            <p class="subtitle">Romanian Premium Digital Banking</p>
        </div>
        <div id="alertArea"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label text-white-50 small">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="you@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-white-50 small">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login" id="loginBtn">Sign In</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-white-50">Demo: andrei.popescu@gmail.com / Andrei2026!</small>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const alertArea = document.getElementById('alertArea');
            alertArea.innerHTML = '';
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const form = new FormData();
            form.append('email', document.getElementById('email').value);
            form.append('password', document.getElementById('password').value);

            try {
                const r = await fetch('/api/auth/login', { method: 'POST', body: form });
                const data = await r.json();

                if (r.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } else {
                    const detail = data.detail || 'Login failed';
                    if (r.status === 403) {
                        alertArea.innerHTML = `<div class="alert alert-lockdown mb-3">
                            <strong>🔒 ACCOUNT LOCKED</strong><br>
                            <small>${detail}</small><br>
                            <small class="text-white-50 mt-1 d-block">A security incident has been detected. Your cards, accounts, and API keys have been frozen. Contact SecurBank support.</small>
                        </div>`;
                    } else {
                        alertArea.innerHTML = `<div class="alert alert-danger mb-3" style="border-radius:12px">${detail}</div>`;
                    }
                }
            } catch (err) {
                alertArea.innerHTML = `<div class="alert alert-danger mb-3" style="border-radius:12px">Connection error</div>`;
            }
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    </script>
</body>
</html>
