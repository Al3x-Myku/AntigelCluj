<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurBank — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0a0e1a; color: #e2e8f0; min-height: 100vh; }
        .glass-card { background: rgba(20,30,50,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 1.5rem; }
        .balance-big { font-size: 2.5rem; font-weight: 800; }
        .card-visual { background: linear-gradient(135deg, #1e3a5f, #2563eb); border-radius: 16px; padding: 1.5rem; color: #fff; min-height: 180px; position: relative; overflow: hidden; }
        .card-visual::after { content: ''; position: absolute; top: -50%; right: -30%; width: 200px; height: 200px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        .navbar-custom { background: rgba(10,14,26,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom px-4 py-3">
        <span class="navbar-brand fw-800 text-white">🏦 SecurBank</span>
        <div>
            <span class="text-white-50 me-3" id="userName"></span>
            <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="glass-card mb-4">
                    <p class="text-white-50 mb-1">Total Balance</p>
                    <div class="balance-big" id="totalBalance">Loading...</div>
                    <p class="text-white-50 small">Across all accounts</p>
                </div>
                <div class="row g-3" id="cardsArea"></div>
            </div>
            <div class="col-lg-4">
                <div class="glass-card mb-3">
                    <h6 class="fw-700 mb-3">📊 Account Summary</h6>
                    <div id="accountSummary"><span class="text-white-50">Loading...</span></div>
                </div>
                <div class="glass-card">
                    <h6 class="fw-700 mb-3">🔑 API Keys</h6>
                    <div id="apiKeysArea"><span class="text-white-50">Loading...</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) window.location.href = '/';

        document.getElementById('userName').textContent = user.full_name || user.email;

        // For a real app we'd fetch data; for the demo mockup, show static content from login
        document.getElementById('totalBalance').textContent = '€ 24,531.42';
        document.getElementById('accountSummary').innerHTML = `
            <div class="d-flex justify-content-between mb-2"><span class="text-white-50">Checking</span><strong>€ 8,231.42</strong></div>
            <div class="d-flex justify-content-between mb-2"><span class="text-white-50">Savings</span><strong>€ 16,300.00</strong></div>
        `;
        document.getElementById('cardsArea').innerHTML = `
            <div class="col-md-6"><div class="card-visual">
                <div class="small text-white-50 mb-3">VISA DEBIT</div>
                <div class="fw-600 fs-5 mb-3" style="letter-spacing:3px">•••• •••• •••• 4521</div>
                <div class="d-flex justify-content-between"><span>${user.full_name || 'CARD HOLDER'}</span><span>12/27</span></div>
            </div></div>
            <div class="col-md-6"><div class="card-visual" style="background:linear-gradient(135deg,#7c3aed,#a855f7)">
                <div class="small text-white-50 mb-3">MASTERCARD CREDIT</div>
                <div class="fw-600 fs-5 mb-3" style="letter-spacing:3px">•••• •••• •••• 8834</div>
                <div class="d-flex justify-content-between"><span>${user.full_name || 'CARD HOLDER'}</span><span>06/28</span></div>
            </div></div>
        `;
        document.getElementById('apiKeysArea').innerHTML = `
            <div class="mb-2"><span class="badge bg-success bg-opacity-50">Active</span> <small>Mobile App — read</small></div>
            <div class="mb-2"><span class="badge bg-success bg-opacity-50">Active</span> <small>Trading Bot — read+write</small></div>
        `;

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }
    </script>
</body>
</html>
