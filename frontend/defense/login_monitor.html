</tr>

<script>
    let currentFilter = 'all';

    function setFilter(filter, el) {
        currentFilter = filter;
        document.getElementById('btnAll').classList.remove('bg-primary', 'text-on-primary');
        document.getElementById('btnAnomalous').classList.remove('bg-primary', 'text-on-primary');
        el.classList.add('bg-primary', 'text-on-primary');
        loadEvents();
    }
    // Initialize active state
    document.getElementById('btnAll').classList.add('bg-primary', 'text-on-primary');

    function loadEvents() {
        const endpoint = currentFilter === 'anomalous' ? '/api/defense/anomalies' : '/api/defense/events?limit=100';
        fetch(endpoint)
            .then(r => r.json())
            .then(data => {
                const events = data.events || data.anomalies || [];
                document.getElementById('eventCount').textContent = `${events.length} events`;
                const feed = document.getElementById('eventFeed');

                if (events.length === 0) {
                    feed.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-outline">No events found</td></tr>';
                    return;
                }

                const threshold = 20.09; // approx

                feed.innerHTML = events.map(e => {
                    let trClass = 'border-b border-[#1e293b] text-on-surface hover:bg-surface-container-low transition-colors';
                    let scoreDisplay = '';
                    
                    if (e.anomaly_score > threshold) {
                        trClass = 'bg-error-container/30 border-b border-[#1e293b] text-error hover:bg-error-container/40 transition-colors';
                        scoreDisplay = `<div class="flex items-center gap-2"><span class="font-bold">${e.anomaly_score.toFixed(1)}</span><span class="material-symbols-outlined text-sm fill-icon">warning</span></div>`;
                    } else if (e.anomaly_score > threshold * 0.6) {
                        trClass = 'bg-tertiary-container/20 border-b border-[#1e293b] text-tertiary hover:bg-tertiary-container/30 transition-colors';
                        scoreDisplay = `<div class="flex items-center gap-2"><span>${e.anomaly_score.toFixed(1)}</span></div>`;
                    } else {
                        scoreDisplay = `<div class="flex items-center gap-2 text-secondary"><span>${e.anomaly_score !== null ? e.anomaly_score.toFixed(1) : '-'}</span></div>`;
                    }

                    const time = e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : '-';
                    
                    return `<tr class="${trClass}">
                        <td class="px-4 py-3 text-on-surface-variant">${time}</td>
                        <td class="px-4 py-3 ${e.anomaly_score > threshold ? 'font-semibold' : ''}">${e.username}</td>
                        <td class="px-4 py-3">${e.ip_address}</td>
                        <td class="px-4 py-3 text-on-surface-variant">${e.city || '-'}, ${e.country || '-'}</td>
                        <td class="px-4 py-3">${scoreDisplay}</td>
                    </tr>`;
                }).join('');
            });
    }

    async function simulateAttack() {
        await fetch('/api/defense/simulate-login?is_attack=true', { method: 'POST' });
        loadEvents();
    }

    loadEvents();
    setInterval(loadEvents, 3000);
</script>
