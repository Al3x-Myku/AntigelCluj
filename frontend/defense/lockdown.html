<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard — Lockdown Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0b1120; color: #e2e8f0; min-height: 100vh; }
        .glass-card {
            background: rgba(30,41,59,0.5); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 1.5rem;
        }
        .account-card {
            background: rgba(30,41,59,0.4); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 1.2rem; margin-bottom: 1rem;
            transition: all 0.3s;
        }
        .account-card:hover { border-color: rgba(255,255,255,0.12); }
        .account-card.locked { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
        .resource-group {
            margin-top: 0.8rem; padding: 0.8rem; background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .resource-group h6 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); margin-bottom: 0.5rem; }
        .resource-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.4rem 0.6rem; border-radius: 6px; margin-bottom: 3px;
            background: rgba(255,255,255,0.02); font-size: 0.85rem;
        }
        .btn-lockdown {
            background: linear-gradient(135deg, #ef4444, #dc2626); border: none;
            border-radius: 10px; font-weight: 700; color: #fff; padding: 0.5rem 1.2rem;
            transition: all 0.3s;
        }
        .btn-lockdown:hover { box-shadow: 0 0 30px rgba(239,68,68,0.4); color: #fff; }
        .btn-restore {
            background: linear-gradient(135deg, #10b981, #059669); border: none;
            border-radius: 10px; font-weight: 700; color: #fff; padding: 0.5rem 1.2rem;
        }
        .btn-restore:hover { box-shadow: 0 0 30px rgba(16,185,129,0.4); color: #fff; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.active { background: #10b981; }
        .status-dot.frozen, .status-dot.revoked, .status-dot.suspended { background: #ef4444; }
        #nav-placeholder { position: sticky; top: 0; z-index: 1050; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="container-fluid px-4 py-3">
        <div class="mb-4">
            <a href="/defense/" class="text-white-50 text-decoration-none">← Defense Overview</a>
            <h2 class="fw-800 mt-1">🔒 Lockdown Manager</h2>
            <p class="text-white-50">Account Resource Protection — Freeze cards, revoke sessions, suspend subscriptions</p>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <div id="accountList"><div class="text-center text-white-50 py-5">Loading accounts...</div></div>
            </div>
            <div class="col-lg-4">
                <div class="glass-card mb-3">
                    <h6 class="fw-700 mb-3">📋 Lockdown Summary</h6>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-white-50">Total Accounts</span>
                        <strong id="sumTotal">0</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-white-50">Active</span>
                        <strong class="text-success" id="sumActive">0</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-white-50">Locked Down</span>
                        <strong class="text-danger" id="sumLocked">0</strong>
                    </div>
                </div>
                <div class="glass-card">
                    <h6 class="fw-700 mb-3">⚡ Bulk Actions</h6>
                    <div class="d-grid gap-2">
                        <button class="btn btn-lockdown" onclick="lockdownAll()">🔒 Lock All Compromised</button>
                        <button class="btn btn-outline-secondary" onclick="loadAccounts()">🔄 Refresh</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="toast-container">
            <div id="statusToast" class="toast" role="alert">
                <div class="toast-body bg-dark text-white rounded" style="border:1px solid rgba(255,255,255,0.1);" id="toastMsg"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('/static/shared/nav.html').then(r => r.text()).then(h => document.getElementById('nav-placeholder').innerHTML = h);

        function showToast(msg) {
            document.getElementById('toastMsg').textContent = msg;
            new bootstrap.Toast(document.getElementById('statusToast'), { delay: 3000 }).show();
        }

        function statusDot(status) {
            return `<span class="status-dot ${status}"></span>`;
        }

        function statusBadge(status) {
            const colors = { active: 'success', frozen: 'danger', revoked: 'danger', suspended: 'warning', expired: 'secondary' };
            return `<span class="badge bg-${colors[status] || 'secondary'} bg-opacity-75">${status}</span>`;
        }

        function loadAccounts() {
            fetch('/api/defense/accounts')
                .then(r => r.json())
                .then(data => {
                    const accts = data.accounts || [];
                    document.getElementById('sumTotal').textContent = accts.length;
                    document.getElementById('sumActive').textContent = accts.filter(a => a.is_active && !a.is_locked).length;
                    document.getElementById('sumLocked').textContent = accts.filter(a => a.is_locked).length;

                    const list = document.getElementById('accountList');
                    list.innerHTML = accts.map(a => {
                        const cards = (a.cards || []).map(c => `
                            <div class="resource-item">
                                <span>${statusDot(c.status)} ${c.card_number_masked} <span class="text-white-50">(${c.card_type})</span></span>
                                ${statusBadge(c.status)}
                            </div>`).join('');

                        const sessions = (a.sessions || []).map(s => `
                            <div class="resource-item">
                                <span>${statusDot(s.status)} ${s.session_token} <span class="text-white-50">${s.ip_address || ''}</span></span>
                                ${statusBadge(s.status)}
                            </div>`).join('');

                        const subs = (a.subscriptions || []).map(s => `
                            <div class="resource-item">
                                <span>${statusDot(s.status)} ${s.plan_name}</span>
                                ${statusBadge(s.status)}
                            </div>`).join('');

                        const tokens = (a.api_tokens || []).map(t => `
                            <div class="resource-item">
                                <span>${statusDot(t.status)} ${t.token_name}</span>
                                ${statusBadge(t.status)}
                            </div>`).join('');

                        const lockBtn = a.is_locked
                            ? `<button class="btn btn-restore btn-sm" onclick="restoreAccount(${a.id})">✅ Restore</button>`
                            : `<button class="btn btn-lockdown btn-sm" onclick="lockdownAccount(${a.id})">🔒 Lockdown</button>`;

                        return `<div class="account-card ${a.is_locked ? 'locked' : ''}">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <div>
                                    <strong class="fs-5">${a.full_name || a.username}</strong>
                                    <span class="text-white-50 ms-2">@${a.username}</span>
                                    ${a.is_locked ? '<span class="badge bg-danger ms-2">🔒 LOCKED</span>' : '<span class="badge bg-success bg-opacity-50 ms-2">Active</span>'}
                                </div>
                                ${lockBtn}
                            </div>
                            <div class="text-white-50 mb-2" style="font-size:0.85rem">${a.email}</div>

                            <div class="row g-2">
                                <div class="col-md-6">
                                    <div class="resource-group">
                                        <h6>💳 Cards (${(a.cards || []).length})</h6>
                                        ${cards || '<div class="text-white-50" style="font-size:0.8rem">None</div>'}
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="resource-group">
                                        <h6>🔑 Sessions (${(a.sessions || []).length})</h6>
                                        ${sessions || '<div class="text-white-50" style="font-size:0.8rem">None</div>'}
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="resource-group">
                                        <h6>📦 Subscriptions (${(a.subscriptions || []).length})</h6>
                                        ${subs || '<div class="text-white-50" style="font-size:0.8rem">None</div>'}
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="resource-group">
                                        <h6>🔐 API Tokens (${(a.api_tokens || []).length})</h6>
                                        ${tokens || '<div class="text-white-50" style="font-size:0.8rem">None</div>'}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    }).join('');
                });
        }

        async function lockdownAccount(id) {
            if (!confirm('Execute full lockdown? This will freeze all resources.')) return;
            const r = await fetch(`/api/defense/lockdown/${id}`, { method: 'POST' });
            const d = await r.json();
            showToast(`🔒 Lockdown executed on ${d.username}: ${(d.actions || []).join(', ')}`);
            loadAccounts();
        }

        async function restoreAccount(id) {
            const r = await fetch(`/api/defense/lockdown/${id}/restore`, { method: 'POST' });
            showToast('✅ Account restored');
            loadAccounts();
        }

        async function lockdownAll() {
            if (!confirm('Lock down ALL accounts? This is a drastic measure.')) return;
            const r = await fetch('/api/defense/accounts');
            const d = await r.json();
            for (const a of (d.accounts || [])) {
                if (!a.is_locked) {
                    await fetch(`/api/defense/lockdown/${a.id}`, { method: 'POST' });
                }
            }
            showToast('🔒 All accounts locked down');
            loadAccounts();
        }

        loadAccounts();
        setInterval(loadAccounts, 10000);
    </script>
</body>
</html>
