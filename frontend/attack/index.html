<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard — Attack Dashboard</title>
    <meta name="description" content="PhishGuard Red Team Campaign Dashboard — manage and monitor phishing simulation campaigns.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0b1120; color: #e2e8f0; min-height: 100vh; }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
        .stat-number { font-size: 2.2rem; font-weight: 800; line-height: 1; }
        .stat-label { font-size: 0.78rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .gradient-red { background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-blue { background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-green { background: linear-gradient(135deg, #10b981, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-glow {
            background: linear-gradient(135deg, #ef4444, #f97316);
            border: none; border-radius: 12px; padding: 0.7rem 1.5rem;
            font-weight: 600; color: #fff; transition: all 0.3s;
        }
        .btn-glow:hover { box-shadow: 0 0 30px rgba(239,68,68,0.4); transform: translateY(-1px); color: #fff; }
        .table-dark-custom { background: transparent; }
        .table-dark-custom th { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.06); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); }
        .table-dark-custom td { border-color: rgba(255,255,255,0.04); vertical-align: middle; }
        .table-dark-custom tbody tr:hover { background: rgba(255,255,255,0.03); }
        .page-header { padding: 2rem 0 1rem; }
        .page-header h1 { font-size: 1.8rem; font-weight: 800; }
        #nav-placeholder { position: sticky; top: 0; z-index: 1050; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container-fluid px-4">
        <!-- Header -->
        <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1><span class="gradient-red">⚔ Attack Dashboard</span></h1>
                <p class="text-white-50 mb-0">Red Team Campaign Management & Metrics</p>
            </div>
            <a href="/attack/campaign/create" class="btn btn-glow">
                <span class="me-1">+</span> New Campaign
            </a>
        </div>

        <!-- Global Stats -->
        <div class="row g-3 mb-4" id="globalStats">
            <div class="col-6 col-md-3">
                <div class="glass-card text-center">
                    <div class="stat-number gradient-blue" id="statTotal">0</div>
                    <div class="stat-label">Total Campaigns</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="glass-card text-center">
                    <div class="stat-number gradient-green" id="statRunning">0</div>
                    <div class="stat-label">Running</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="glass-card text-center">
                    <div class="stat-number gradient-red" id="statTargets">0</div>
                    <div class="stat-label">Total Targets</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="glass-card text-center">
                    <div class="stat-number" style="color: #f59e0b;" id="statClicked">0</div>
                    <div class="stat-label">Total Clicked</div>
                </div>
            </div>
        </div>

        <!-- Campaign Table -->
        <div class="glass-card">
            <h5 class="mb-3 fw-700">All Campaigns</h5>
            <div class="table-responsive">
                <table class="table table-dark-custom mb-0" id="campaignTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Channels</th>
                            <th>Targets</th>
                            <th>Sent</th>
                            <th>Clicked</th>
                            <th>Submitted</th>
                            <th>Created</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="campaignBody">
                        <tr><td colspan="9" class="text-center text-white-50 py-4">Loading campaigns...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/shared/charts.js"></script>
    <script>
        // Load navbar
        fetch('/static/shared/nav.html').then(r => r.text()).then(html => {
            document.getElementById('nav-placeholder').innerHTML = html;
        });

        function loadCampaigns() {
            fetch('/api/attack/campaigns')
                .then(r => r.json())
                .then(data => {
                    const campaigns = data.campaigns || [];
                    const body = document.getElementById('campaignBody');

                    // Update global stats
                    document.getElementById('statTotal').textContent = campaigns.length;
                    document.getElementById('statRunning').textContent = campaigns.filter(c => c.status === 'running' || c.status === 'queued').length;
                    document.getElementById('statTargets').textContent = campaigns.reduce((s, c) => s + (c.stats?.total_targets || 0), 0);
                    document.getElementById('statClicked').textContent = campaigns.reduce((s, c) => s + (c.stats?.total_clicked || 0), 0);

                    if (campaigns.length === 0) {
                        body.innerHTML = '<tr><td colspan="9" class="text-center text-white-50 py-5">No campaigns yet. <a href="/attack/campaign/create" class="text-primary">Create one →</a></td></tr>';
                        return;
                    }

                    body.innerHTML = campaigns.map(c => {
                        const channels = Object.entries(c.channels || {}).filter(([k, v]) => v).map(([k]) => k);
                        const channelBadges = channels.map(ch => `<span class="badge bg-secondary bg-opacity-50 me-1">${ch}</span>`).join('');
                        const created = c.created_at ? new Date(c.created_at).toLocaleDateString() : '-';
                        return `<tr style="cursor:pointer" onclick="window.location='/attack/campaign/${c.id}'">
                            <td class="fw-600">${c.name}</td>
                            <td>${statusBadge(c.status)}</td>
                            <td>${channelBadges}</td>
                            <td>${c.stats?.total_targets || 0}</td>
                            <td>${c.stats?.total_sent || 0}</td>
                            <td><span class="text-warning">${c.stats?.total_clicked || 0}</span></td>
                            <td><span class="text-danger">${c.stats?.total_submitted || 0}</span></td>
                            <td class="text-white-50">${created}</td>
                            <td><a href="/attack/campaign/${c.id}" class="btn btn-sm btn-outline-light">View →</a></td>
                        </tr>`;
                    }).join('');
                })
                .catch(err => {
                    document.getElementById('campaignBody').innerHTML = '<tr><td colspan="9" class="text-center text-danger py-4">Error loading campaigns</td></tr>';
                });
        }

        loadCampaigns();
        setInterval(loadCampaigns, 5000);
    </script>
</body>
</html>
