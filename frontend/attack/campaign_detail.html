<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard — Campaign Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0b1120; color: #e2e8f0; min-height: 100vh; }
        .glass-card {
            background: rgba(30,41,59,0.5); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 1.5rem;
        }
        .stat-number { font-size: 2rem; font-weight: 800; line-height: 1; }
        .stat-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .gradient-red { background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-blue { background: linear-gradient(135deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-green { background: linear-gradient(135deg, #10b981, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-launch { background: linear-gradient(135deg, #ef4444, #f97316); border: none; border-radius: 12px; padding: 0.6rem 1.5rem; font-weight: 700; color: #fff; }
        .btn-launch:hover { box-shadow: 0 0 30px rgba(239,68,68,0.4); color: #fff; }
        .chart-container { position: relative; height: 280px; }
        .table-dark-custom { background: transparent; }
        .table-dark-custom th { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.06); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); }
        .table-dark-custom td { border-color: rgba(255,255,255,0.04); font-size: 0.9rem; }
        #nav-placeholder { position: sticky; top: 0; z-index: 1050; }
        .live-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="container-fluid px-4 py-3">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <a href="/attack/" class="text-white-50 text-decoration-none mb-1 d-inline-block">← Campaigns</a>
                <h2 class="fw-800 mb-0" id="campaignName">Loading...</h2>
                <div class="d-flex align-items-center gap-2 mt-1">
                    <span id="campaignStatus"></span>
                    <span class="live-dot" id="liveDot" style="display:none"></span>
                    <span class="text-white-50" style="font-size:0.8rem" id="liveLabel"></span>
                </div>
            </div>
            <button class="btn btn-launch" id="launchBtn" onclick="launchCampaign()" style="display:none">
                🚀 Launch Campaign
            </button>
        </div>

        <!-- Live Counters -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-2"><div class="glass-card text-center"><div class="stat-number gradient-blue" id="cntTargets">0</div><div class="stat-label">Targets</div></div></div>
            <div class="col-6 col-lg-2"><div class="glass-card text-center"><div class="stat-number gradient-green" id="cntSent">0</div><div class="stat-label">Sent</div></div></div>
            <div class="col-6 col-lg-2"><div class="glass-card text-center"><div class="stat-number" style="color:#f59e0b" id="cntClicked">0</div><div class="stat-label">Clicked</div></div></div>
            <div class="col-6 col-lg-2"><div class="glass-card text-center"><div class="stat-number gradient-red" id="cntSubmitted">0</div><div class="stat-label">Submitted</div></div></div>
            <div class="col-6 col-lg-2"><div class="glass-card text-center"><div class="stat-number" style="color:#f43f5e" id="cntFailed">0</div><div class="stat-label">Failed</div></div></div>
            <div class="col-6 col-lg-2"><div class="glass-card text-center"><div class="stat-number" style="color:#64748b" id="cntPending">0</div><div class="stat-label">Pending</div></div></div>
        </div>

        <!-- Charts Row -->
        <div class="row g-3 mb-4">
            <div class="col-lg-6">
                <div class="glass-card">
                    <h6 class="fw-700 mb-3">📊 Funnel: Sent → Clicked → Submitted</h6>
                    <div class="chart-container"><canvas id="funnelChart"></canvas></div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="glass-card">
                    <h6 class="fw-700 mb-3">📡 Per-Channel Breakdown</h6>
                    <div class="chart-container"><canvas id="channelChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-lg-8">
                <div class="glass-card">
                    <h6 class="fw-700 mb-3">📈 Timeline: Messages Sent Over Time</h6>
                    <div class="chart-container"><canvas id="timelineChart"></canvas></div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="glass-card">
                    <h6 class="fw-700 mb-3">🕐 Heatmap: Clicks by Hour</h6>
                    <div class="chart-container"><canvas id="heatmapChart"></canvas></div>
                </div>
            </div>
        </div>

        <!-- Target Table -->
        <div class="glass-card">
            <h6 class="fw-700 mb-3">🎯 Targets</h6>
            <div class="table-responsive">
                <table class="table table-dark-custom mb-0">
                    <thead><tr><th>Name</th><th>Email</th><th>Channel</th><th>Status</th><th>Clicked</th><th>Submitted</th><th>IP</th></tr></thead>
                    <tbody id="targetBody"><tr><td colspan="7" class="text-center text-white-50 py-3">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/shared/charts.js"></script>
    <script>
        fetch('/static/shared/nav.html').then(r => r.text()).then(html => document.getElementById('nav-placeholder').innerHTML = html);

        const campaignId = window.location.pathname.split('/').filter(Boolean).pop();
        let funnelChartObj, channelChartObj, timelineChartObj, heatmapChartObj;

        // Load campaign detail
        function loadDetail() {
            fetch(`/api/attack/campaigns/${campaignId}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('campaignName').textContent = data.name;
                    document.getElementById('campaignStatus').innerHTML = statusBadge(data.status);
                    if (data.status === 'draft' || data.status === 'failed') {
                        document.getElementById('launchBtn').style.display = 'inline-block';
                    } else {
                        document.getElementById('launchBtn').style.display = 'none';
                    }
                    if (data.status === 'running' || data.status === 'queued') {
                        document.getElementById('liveDot').style.display = 'inline-block';
                        document.getElementById('liveLabel').textContent = 'Live — updating every 3s';
                    }
                    // Targets table
                    const targets = data.targets || [];
                    const body = document.getElementById('targetBody');
                    if (targets.length > 0) {
                        body.innerHTML = targets.map(t => `<tr>
                            <td>${t.name || '-'}</td>
                            <td class="text-white-50">${t.email || '-'}</td>
                            <td>${t.channel_used ? `<span class="badge bg-secondary">${t.channel_used}</span>` : '-'}</td>
                            <td>${statusBadge(t.status)}</td>
                            <td>${t.clicked_at ? new Date(t.clicked_at).toLocaleTimeString() : '-'}</td>
                            <td>${t.submitted_at ? '<span class="text-danger">✓ Captured</span>' : '-'}</td>
                            <td class="text-white-50">${t.ip_address || '-'}</td>
                        </tr>`).join('');
                    }
                });
        }

        // Load stats (polling)
        function loadStats() {
            fetch(`/api/attack/stats/${campaignId}`)
                .then(r => r.json())
                .then(data => {
                    const t = data.totals;
                    document.getElementById('cntTargets').textContent = t.targets;
                    document.getElementById('cntSent').textContent = t.sent;
                    document.getElementById('cntClicked').textContent = t.clicked;
                    document.getElementById('cntSubmitted').textContent = t.submitted;
                    document.getElementById('cntFailed').textContent = t.failed;
                    document.getElementById('cntPending').textContent = t.pending;

                    // Destroy and recreate charts (simpler than updating)
                    if (funnelChartObj) funnelChartObj.destroy();
                    if (channelChartObj) channelChartObj.destroy();
                    if (timelineChartObj) timelineChartObj.destroy();
                    if (heatmapChartObj) heatmapChartObj.destroy();

                    funnelChartObj = createFunnelChart('funnelChart', data.funnel);
                    channelChartObj = createChannelChart('channelChart', data.per_channel);
                    if (Object.keys(data.timeline).length > 0) {
                        timelineChartObj = createTimelineChart('timelineChart', data.timeline);
                    }

                    // Heatmap as bar chart
                    const heatCtx = document.getElementById('heatmapChart');
                    if (heatCtx) {
                        const hours = Array.from({ length: 24 }, (_, i) => `${i}:00`);
                        const heatData = hours.map((_, i) => data.heatmap[i] || 0);
                        heatmapChartObj = new Chart(heatCtx, {
                            type: 'bar',
                            data: {
                                labels: hours,
                                datasets: [{ data: heatData, backgroundColor: heatData.map(v => v > 0 ? 'rgba(239,68,68,0.6)' : 'rgba(255,255,255,0.05)'), borderRadius: 3 }]
                            },
                            options: {
                                responsive: true, maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    x: { grid: { display: false }, ticks: { maxRotation: 90, font: { size: 9 } } },
                                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
                                }
                            }
                        });
                    }
                });
        }

        async function launchCampaign() {
            const btn = document.getElementById('launchBtn');
            btn.disabled = true; btn.textContent = 'Launching...';
            try {
                const resp = await fetch(`/api/attack/campaigns/${campaignId}/launch`, { method: 'POST' });
                const data = await resp.json();
                if (resp.ok) { loadDetail(); loadStats(); }
                else alert(data.detail || 'Launch failed');
            } catch (e) { alert('Launch error: ' + e.message); }
            btn.disabled = false; btn.textContent = '🚀 Launch Campaign';
        }

        loadDetail();
        loadStats();
        setInterval(loadStats, 3000);
        setInterval(loadDetail, 5000);
    </script>
</body>
</html>
